# Replace public keys and supply matching private-key files before use.
# Documentation networks only: choose non-overlapping networks for deployment.
interfaces:
  - name: wg-transit
    addresses: [192.0.2.1/32]
    mtu: 1280
    listenPort: 51820
    privateKeyFile: /etc/wg-link/keys/transit-private
    routes: [192.0.2.2/32, 203.0.113.0/25]
    peers:
      - publicKey: PEER_PUBLIC_KEY_PLACEHOLDER
        presharedKeyFile: /etc/wg-link/keys/transit-psk
        allowedIPs: [192.0.2.2/32, 203.0.113.0/25]
        persistentKeepalive: 25 # Integer seconds; 0 disables keepalives.
        service:
          namespace: wg-link
          name: peer-gateway
          port: wireguard # Named UDP port on the peer Service/EndpointSlice.
        # Static alternative: remove service and use endpoint: 203.0.113.200:51820
  - name: wg-access
    addresses: [198.51.100.1/32]
    mtu: 1280
    listenPort: 51821
    privateKeyFile: /etc/wg-link/keys/access-private
    routes: [198.51.100.2/32]
    peers:
      - publicKey: MOBILE_PUBLIC_KEY_PLACEHOLDER
        allowedIPs: [198.51.100.2/32]
        # No endpoint or service: learn the endpoint from authenticated traffic.

# Optional: only this access peer may initiate HTTPS to the transit subnet.
# Both interfaces must be declared above and owned by this container.
# Configure reciprocal peer AllowedIPs/routes and return routes separately.
forwarding:
  enabled: true
  rules:
    - from: wg-access
      to: wg-transit
      source: 198.51.100.2/32
      destination: 203.0.113.0/25
      protocols: [tcp]
      ports: [443] # Integer destination ports; omitted/empty means all TCP/UDP ports.
# Exact reverse ESTABLISHED replies are allowed; other owned-interface forwarding
# is dropped. No broad RELATED allowance (related ICMP is denied).
# Requires net.ipv4.ip_forward=1; preconfigure via permitted Pod sysctls if needed.
# After first enablement, disabling/omitting retains a deny-only boundary and
# historical interface names; it does not reset sysctls. Recreate the Pod network
# namespace or arrange deliberate operator cleanup to remove that boundary.

# Optional external-link/NAT extension (merge into forwarding above):
# externalInterfaces: [eth0] # Existing namespace-local link, never managed by wg-link.
# rules:
#   - from: eth0
#     to: eth0
#     source: 198.18.10.0/24
#     destination: 203.0.113.0/24
#     protocols: [tcp, udp]
# masquerade:
#   - from: eth0
#     to: eth0
#     source: 198.18.10.0/24
#     destination: 203.0.113.0/24
# NAT requires enabled forwarding and explicit canonical IPv4 source/destination.
# Match both ingress and egress; unrelated destinations are not translated.
# All forwarding involving an allowlisted external link is denied without ACLs.
