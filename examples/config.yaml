# Replace public keys and supply matching private-key files before use.
# Documentation networks only: choose non-overlapping networks for deployment.
interfaces:
  - name: wg-transit
    addresses: [192.0.2.1/32]
    mtu: 1280
    listenPort: 51820
    privateKeyFile: /etc/wg-link/keys/transit-private
    routes: [192.0.2.2/32, 203.0.113.0/25]
    peers:
      - publicKey: PEER_PUBLIC_KEY_PLACEHOLDER
        presharedKeyFile: /etc/wg-link/keys/transit-psk
        allowedIPs: [192.0.2.2/32, 203.0.113.0/25]
        persistentKeepalive: 25 # Integer seconds; 0 disables keepalives.
        service:
          namespace: wg-link
          name: peer-gateway
          port: wireguard # Named UDP port on the peer Service/EndpointSlice.
        # Static alternative: remove service and use endpoint: 203.0.113.200:51820
  - name: wg-access
    addresses: [198.51.100.1/32]
    mtu: 1280
    listenPort: 51821
    privateKeyFile: /etc/wg-link/keys/access-private
    routes: [198.51.100.2/32]
    peers:
      - publicKey: MOBILE_PUBLIC_KEY_PLACEHOLDER
        allowedIPs: [198.51.100.2/32]
        # No endpoint or service: learn the endpoint from authenticated traffic.
