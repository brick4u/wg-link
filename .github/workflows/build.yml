name: Test and publish image

on:
  pull_request:
  push:
    branches: [master]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build integration image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: wg-link:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: WireGuard network integration
        shell: bash
        run: |
          set +e
          bash tests/integration.sh 2>&1 | tee /tmp/wg-link-integration.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('/tmp/wg-link-integration.log').read_text()[-6000:]
          text = re.sub(r'[A-Za-z0-9+/]{43}=', '[REDACTED-KEY]', text)
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=WireGuard integration failure::' + text)
          PY
          fi
          exit "$status"

  image:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Image metadata
        id: image
        shell: bash
        env:
          CONFIGURED_IMAGE: ${{ vars.CONTAINER_IMAGE }}
        run: |
          image="${CONFIGURED_IMAGE:-ghcr.io/${GITHUB_REPOSITORY,,}}"
          publish=false
          tag=ci
          if [[ "$GITHUB_REF" == refs/heads/master ]]; then
            tag=master
            publish=true
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo 'Release tags must have the form 1.0.0 (no v prefix).' >&2
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
            publish=true
          fi
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "registry=${image%%/*}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to GHCR
        if: steps.image.outputs.publish == 'true' && steps.image.outputs.registry == 'ghcr.io'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to external registry
        if: steps.image.outputs.publish == 'true' && steps.image.outputs.registry != 'ghcr.io'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.image.outputs.publish == 'true' }}
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
